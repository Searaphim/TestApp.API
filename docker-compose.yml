services:
  testapp.api:
    image: ${DOCKER_REGISTRY-}testappapi
    build:
      context: TestApp.API
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=MyAppDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      - db
    ports:
      - "8080:8080"  # HTTP HOST_MACHINE:CONTAINER
      - "8081:8081"  # HTTPS HOST_MACHINE:CONTAINER 

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
        - SA_PASSWORD=YourStrong!Passw0rd
        - ACCEPT_EULA=Y
    ports:
        - "1433:1433"  # Exposes SQL Server's default port
    volumes:
        - dbdata:/var/opt/mssql  # Create volume for persistent data

volumes:
  dbdata:
    driver: local # Ensures data persists across container restarts